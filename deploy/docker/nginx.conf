# =========================================================
# 萬象天儀 Nginx 反向代理配置 (前後台隔離 + SSE 串流 + 快取壓縮)
# =========================================================

# 1. 公眾主站 (apps/web) — 徹底阻斷 /api/v1/admin/* 與 /admin 存取
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip 壓縮優化
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/x-javascript application/xml application/json image/webp;
    gzip_disable "MSIE [1-6]\.";

    # 帶 Hash 靜態資源長快取 (1 年 immutable)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|avif|woff2?|eot|ttf|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # [P0-SEC-01] 公網主站嚴禁暴露後台管理與資料庫端點
    location ^~ /api/v1/admin {
        return 403;
    }

    location ^~ /admin {
        return 404;
    }

    # [P1-PERF-02] LLM SSE 串流專線：關閉緩衝與快取並延長逾時至 180s
    location /api/v1/llm/ {
        proxy_pass http://server:5499/api/v1/llm/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_connect_timeout 30s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # 反向代理後端一般 API
    location /api/ {
        proxy_pass http://server:5499/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # SPA 前端路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# 2. 獨立隔離管理後台 (apps/admin) — 獨立子網域/Port 8080 + 內網 IP 白名單限制
server {
    listen 8080;
    server_name admin.yourdomain.com _;

    root /usr/share/nginx/admin;
    index index.html;

    # IP 白名單存取限制 (請依實際維運 VPN / Cloudflare Tunnel 網段調整)
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;

    location /api/ {
        proxy_pass http://server:5499/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
