version: '3.8'

services:
  # 萬象天儀 (CelestialDao) 全端一體化服務
  # 單一服務啟動，單一對外連接埠 5499 (整合 Vue 3 前端 SPA、Node.js Express API 與 SQLite 持久層)
  app:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.server
    container_name: celestial-app
    restart: always
    environment:
      PORT: 5499
      HOST: 0.0.0.0
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-file:/app/packages/database/prisma/dev.db}
      JWT_SECRET: ${JWT_SECRET:-celestial_jwt_super_secret_key_change_me_2026}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      DEMO_MODE: ${DEMO_MODE:-false}
    ports:
      - "5499:5499"
    volumes:
      - celestial_data:/app/packages/database/prisma

volumes:
  celestial_data:
