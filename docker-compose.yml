version: '3.8'

services:
  # 1. Node.js 後端 API 服務
  server:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.server
    container_name: celestial-api-server
    restart: always
    environment:
      PORT: 5498
      HOST: 0.0.0.0
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-file:/app/packages/database/prisma/dev.db}
      JWT_SECRET: ${JWT_SECRET:-celestial_jwt_super_secret_key_change_me_2026}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      DEMO_MODE: ${DEMO_MODE:-false}
    ports:
      - "5498:5498"
    volumes:
      - celestial_data:/app/packages/database/prisma
    networks:
      - celestial-network

  # 2. 前端展示網站 (Vue 3 + Three.js + Nginx)
  web:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.web
    container_name: celestial-web-client
    restart: always
    ports:
      - "5499:80"
    depends_on:
      - server
    networks:
      - celestial-network

volumes:
  celestial_data:

networks:
  celestial-network:
    driver: bridge
