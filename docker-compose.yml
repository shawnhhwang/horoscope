version: '3.8'

services:
  # 萬象天儀 (CelestialDao) 全端一體化服務
  # 單一 Docker 容器，內部同時包含 WEB (Vue 3 前端) 與 API (Node.js Express 後端)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: celestial-app
    restart: always
    environment:
      PORT: 5499
      HOST: 0.0.0.0
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-file:/app/packages/database/prisma/dev.db}
      JWT_SECRET: ${JWT_SECRET:-celestial_jwt_super_secret_key_change_me_2026}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      DEMO_MODE: ${DEMO_MODE:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ADMIN_DB_WRITE_ENABLED: ${ADMIN_DB_WRITE_ENABLED:-false}
      LLM_ALLOW_PRIVATE_HOSTS: ${LLM_ALLOW_PRIVATE_HOSTS:-}
    depends_on:
      - redis
    ports:
      - "5499:5499"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5499/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - celestial_data:/app/packages/database/prisma

  redis:
    image: redis:7-alpine
    container_name: celestial-redis
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - celestial_redis:/data

volumes:
  celestial_data:
  celestial_redis:
